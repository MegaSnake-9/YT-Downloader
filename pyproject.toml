[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-downloader-gui"
version = "0.4.48"
description = "A Qt GUI for yt-dlp focused on convenient audio and video downloading."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "MegaSnake-9" }
]
dependencies = [
  "PySide6>=6.7",
  "certifi>=2024.8.30"
]
keywords = ["yt-dlp", "youtube", "downloader", "qt", "pyside6"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Qt",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia"
]

[project.urls]
Homepage = "https://github.com/MegaSnake-9/YT-Downloader"
Repository = "https://github.com/MegaSnake-9/YT-Downloader"
Issues = "https://github.com/MegaSnake-9/YT-Downloader/issues"

[project.scripts]
yt-downloader = "yt_downloader:main"

[tool.setuptools]
py-modules = ["yt_downloader"]
package-dir = {"" = "src"}
