name: Bug report
description: Report a reproducible problem in YT-Downloader
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: YT-Downloader version
      placeholder: 0.4.31
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      placeholder: Arch Linux, KDE Plasma, Wayland
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Tell us what you did and what happened.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Relevant log
      description: Remove cookies, tokens and other private information before posting.
      render: shell
