name: Build AppImage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "assets/**"
      - "packaging/appimage/**"
      - "scripts/build-appimage.sh"
      - "pyproject.toml"
      - "THIRD_PARTY.md"
      - ".github/workflows/appimage.yml"

jobs:
  appimage-x86_64:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl unzip xz-utils \
            libegl1 libgl1 libglx0 libopengl0 libglvnd0

      - name: Build AppImage
        run: ./scripts/build-appimage.sh

      - name: Verify AppImage structure
        run: |
          APPIMAGE="$(find dist -maxdepth 1 -name 'YT-Downloader-*-x86_64.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          test -x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/yt-dlp
          test -x squashfs-root/usr/bin/ffmpeg
          test -x squashfs-root/usr/bin/ffprobe
          test -x squashfs-root/usr/bin/deno
          test -x squashfs-root/usr/bin/kwallet-query
          test -x squashfs-root/usr/bin/dbus-send
          grep -q "/usr/bin/\$name" squashfs-root/usr/bin/kwallet-query
          grep -q "resolved.*!=.*self" squashfs-root/usr/bin/kwallet-query
          test -x squashfs-root/usr/lib/yt-downloader/yt-downloader
          test -f squashfs-root/usr/lib/glvnd/libEGL.so.1
          test -f squashfs-root/usr/lib/glvnd/libGLdispatch.so.0

      - name: Test host-helper wrapper resolution
        run: |
          mkdir -p /tmp/ytdl-host-tools
          cat > /tmp/ytdl-host-tools/kwallet-query <<'EOF'
          #!/usr/bin/env bash
          test "$1" = "--wrapper-self-test"
          EOF
          chmod +x /tmp/ytdl-host-tools/kwallet-query
          YT_DOWNLOADER_APPDIR="$PWD/squashfs-root" \
          YT_DOWNLOADER_HOST_PATH="/tmp/ytdl-host-tools" \
          YT_DOWNLOADER_HOST_LD_LIBRARY_PATH="" \
            squashfs-root/usr/bin/kwallet-query --wrapper-self-test

      - name: Run AppImage runtime self-test
        run: |
          APPIMAGE="$(find dist -maxdepth 1 -name 'YT-Downloader-*-x86_64.AppImage' -print -quit)"
          QT_QPA_PLATFORM=offscreen \
            APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --self-test

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader-AppImage-x86_64
          path: dist/YT-Downloader-*-x86_64.AppImage
          if-no-files-found: error
          compression-level: 0
