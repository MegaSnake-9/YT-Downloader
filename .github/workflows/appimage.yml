name: Build AppImage

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "assets/**"
      - "packaging/appimage/**"
      - "scripts/build-appimage.sh"
      - "scripts/build-portable-appimage-release.sh"
      - "pyproject.toml"
      - "LICENSE"
      - "PRIVACY.md"
      - "THIRD_PARTY.md"
      - ".github/workflows/appimage.yml"

jobs:
  appimage-x86_64:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl unzip zip xz-utils \
            libegl1 libgl1 libglx0 libopengl0 libglvnd0

      - name: Build AppImage
        run: bash ./scripts/build-appimage.sh

      - name: Verify AppImage structure
        run: |
          APPIMAGE="$(find dist -maxdepth 1 -name 'YT-Downloader-*-x86_64.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          test -x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/yt-dlp
          test -x squashfs-root/usr/bin/ffmpeg
          test -x squashfs-root/usr/bin/ffprobe
          test -x squashfs-root/usr/bin/deno
          test ! -e squashfs-root/usr/bin/kwallet-query
          test ! -e squashfs-root/usr/bin/dbus-send
          test -x squashfs-root/usr/lib/yt-downloader/yt-downloader
          test -f squashfs-root/usr/lib/yt-downloader/_internal/libEGL.so.1
          test -f squashfs-root/usr/lib/yt-downloader/_internal/libGLdispatch.so.0

      - name: Run AppImage runtime self-test
        run: |
          APPIMAGE="$(find dist -maxdepth 1 -name 'YT-Downloader-*-x86_64.AppImage' -print -quit)"
          QT_QPA_PLATFORM=offscreen \
            APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --self-test

      - name: Create SHA-256 checksum
        run: |
          APPIMAGE="$(find dist -maxdepth 1 -name 'YT-Downloader-*-x86_64.AppImage' -print -quit)"
          APPIMAGE_NAME="$(basename "$APPIMAGE")"
          (cd dist && sha256sum "$APPIMAGE_NAME" > "$APPIMAGE_NAME.sha256")

      - name: Build portable ZIP
        run: bash ./scripts/build-portable-appimage-release.sh

      - name: Verify portable ZIP
        run: |
          APPIMAGE="$(find dist -maxdepth 1 -name 'YT-Downloader-*-x86_64.AppImage' -print -quit)"
          APPIMAGE_NAME="$(basename "$APPIMAGE")"
          PORTABLE_ZIP="$(find dist -maxdepth 1 -name 'YT-Downloader-*-Linux-x86_64-portable.zip' -print -quit)"
          test -n "$PORTABLE_ZIP"
          test -f "${PORTABLE_ZIP}.sha256"
          TMP_DIR="$(mktemp -d)"
          unzip -q "$PORTABLE_ZIP" -d "$TMP_DIR"
          test -x "$TMP_DIR/YT-Downloader/$APPIMAGE_NAME"
          test -f "$TMP_DIR/YT-Downloader/README.txt"
          test -d "$TMP_DIR/YT-Downloader/data/config"
          test -d "$TMP_DIR/YT-Downloader/data/state"
          test -d "$TMP_DIR/YT-Downloader/data/tools"
          test -d "$TMP_DIR/YT-Downloader/data/cache"
          test -d "$TMP_DIR/YT-Downloader/data/cache/cookies"
          test -d "$TMP_DIR/YT-Downloader/data/integration"
          (cd dist && sha256sum -c "$(basename "$PORTABLE_ZIP").sha256")
          rm -rf "$TMP_DIR"

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: YT-Downloader-Linux-x86_64
          path: |
            dist/YT-Downloader-*-x86_64.AppImage
            dist/YT-Downloader-*-x86_64.AppImage.sha256
            dist/YT-Downloader-*-Linux-x86_64-portable.zip
            dist/YT-Downloader-*-Linux-x86_64-portable.zip.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Publish tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APPIMAGE="$(find dist -maxdepth 1 -name 'YT-Downloader-*-x86_64.AppImage' -print -quit)"
          APPIMAGE_CHECKSUM="${APPIMAGE}.sha256"
          PORTABLE_ZIP="$(find dist -maxdepth 1 -name 'YT-Downloader-*-Linux-x86_64-portable.zip' -print -quit)"
          PORTABLE_CHECKSUM="${PORTABLE_ZIP}.sha256"
          gh release create "$GITHUB_REF_NAME" \
            "$PORTABLE_ZIP" "$PORTABLE_CHECKSUM" \
            "$APPIMAGE" "$APPIMAGE_CHECKSUM" \
            --title "$GITHUB_REF_NAME" --generate-notes
