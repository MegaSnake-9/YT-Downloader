name: Checks

on:
  push:
  pull_request:

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python source
        run: python -m py_compile src/yt_downloader.py

      - name: Verify project version consistency
        run: |
          python - <<'PY'
          import re, tomllib
          from pathlib import Path
          source = Path("src/yt_downloader.py").read_text(encoding="utf-8")
          m = re.search(r'^VERSION\s*=\s*["\']([^"\']+)', source, re.M)
          if not m:
              raise SystemExit("VERSION not found in src/yt_downloader.py")
          with Path("pyproject.toml").open("rb") as f:
              project_version = tomllib.load(f)["project"]["version"]
          if m.group(1) != project_version:
              raise SystemExit(f"Version mismatch: source={m.group(1)} pyproject={project_version}")
          print(f"Version OK: {project_version}")
          PY

      - name: Check shell scripts
        run: |
          bash -n scripts/build-portable-preview.sh
          bash -n scripts/build-appimage.sh
          bash -n packaging/linux-portable/launcher.sh
          bash -n packaging/linux-portable/create-shortcuts.sh
          bash -n packaging/linux-portable/remove-shortcuts.sh
          bash -n packaging/linux-portable/import-existing-settings.sh
